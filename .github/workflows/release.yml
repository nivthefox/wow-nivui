name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: NivUI

      - name: Extract metadata
        id: meta
        working-directory: NivUI
        run: |
          # Interface versions from TOC (e.g. 120000, 120100 -> ["12.0.0", "12.1.0"])
          INTERFACES=$(grep -oP '## Interface:\s*\K.*' NivUI.toc | tr ',' ' ')
          GAME_VERSIONS=$(
            for INTERFACE in $INTERFACES; do
              MAJOR=$((INTERFACE / 10000))
              MINOR=$(( (INTERFACE % 10000) / 100 ))
              PATCH=$((INTERFACE % 100))
              echo "${MAJOR}.${MINOR}.${PATCH}"
            done | jq -R -s -c 'split("\n") | map(select(length > 0))'
          )
          echo "game_versions=$GAME_VERSIONS" >> "$GITHUB_OUTPUT"

          # Release type from tag (alpha/beta -> that, otherwise release)
          TAG="${{ github.event.release.tag_name }}"
          if [[ "$TAG" == *"-alpha"* ]]; then
            echo "cf_release_type=alpha" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == *"-beta"* ]]; then
            echo "cf_release_type=beta" >> "$GITHUB_OUTPUT"
          else
            echo "cf_release_type=release" >> "$GITHUB_OUTPUT"
          fi

      - name: Create zip
        run: zip -r NivUI-${{ github.event.release.tag_name }}.zip NivUI -x "NivUI/.git/*" -x "NivUI/.github/*" -x "NivUI/.agents/*" -x "NivUI/.claude/*" -x "NivUI/CLAUDE.md" -x "NivUI/tests/*" -x "NivUI/docs/*" -x "NivUI/.gitignore" -x "NivUI/.luacheckrc" -x "NivUI/LINTING.md"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: NivUI-${{ github.event.release.tag_name }}.zip

      - name: Upload to CurseForge
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          if [[ -z "$CF_API_TOKEN" || -z "$CF_PROJECT_ID" ]]; then
            echo "::notice::Skipping CurseForge upload: CF_API_TOKEN and CF_PROJECT_ID must both be configured."
            exit 0
          fi

          jq -n \
            --arg changelog "${RELEASE_BODY:-No release notes provided.}" \
            --argjson versions '${{ steps.meta.outputs.game_versions }}' \
            --arg release_type "${{ steps.meta.outputs.cf_release_type }}" \
            --arg display_name "NivUI ${{ github.event.release.tag_name }}" \
            '{
              changelog: $changelog,
              changelogType: "markdown",
              displayName: $display_name,
              gameVersionNames: $versions,
              releaseType: $release_type
            }' > cf-metadata.json

          curl -f -X POST \
            -H "X-Api-Token: $CF_API_TOKEN" \
            -F "metadata=<cf-metadata.json" \
            -F "file=@NivUI-${{ github.event.release.tag_name }}.zip" \
            "https://wow.curseforge.com/api/projects/$CF_PROJECT_ID/upload-file"

      - name: Upload to WoWInterface
        env:
          WOWI_ADDON_ID: ${{ vars.WOWI_ADDON_ID }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          RELEASE_BODY: ${{ github.event.release.body }}
          GAME_VERSIONS: ${{ steps.meta.outputs.game_versions }}
        run: |
          if [[ -z "$WOWI_API_TOKEN" || -z "$WOWI_ADDON_ID" ]]; then
            echo "::notice::Skipping WoWInterface upload: WOWI_API_TOKEN and WOWI_ADDON_ID must both be configured."
            exit 0
          fi

          COMPATIBLE=$(jq -r 'join(",")' <<< "$GAME_VERSIONS")

          curl -f \
            -H "x-api-token: $WOWI_API_TOKEN" \
            -F "id=$WOWI_ADDON_ID" \
            -F "version=${{ github.event.release.tag_name }}" \
            -F "compatible=$COMPATIBLE" \
            -F "changelog=$RELEASE_BODY" \
            -F "updatefile=@NivUI-${{ github.event.release.tag_name }}.zip" \
            https://api.wowinterface.com/addons/update

      - name: Announce on Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_TIMESTAMP: ${{ github.event.release.published_at }}
        run: |
          payload=$(jq -n \
            --arg title "NivUI ${RELEASE_NAME:-$RELEASE_TAG} released" \
            --arg url "$RELEASE_URL" \
            --arg body "${RELEASE_BODY:-No release notes provided.}" \
            --arg timestamp "$RELEASE_TIMESTAMP" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: $body,
                color: 65430,
                timestamp: $timestamp,
                footer: { text: "NivUI" }
              }]
            }')
          curl -fsS -H "Content-Type: application/json" -X POST -d "$payload" "$DISCORD_WEBHOOK"
